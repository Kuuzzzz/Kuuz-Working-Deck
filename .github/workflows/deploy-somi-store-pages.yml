name: Publish Somi Store to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "somi-store/**"
      - ".github/workflows/deploy-somi-store-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: somi-store-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package Somi Store
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./somi-store
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
